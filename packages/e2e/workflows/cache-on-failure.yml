on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Setup TeX Live
        id: setup
        uses: $/.
      - name: Check that a new installation has been made
        run: exit ${{ fromJSON(steps.setup.outputs.cache-restored) || 1 && 0 }}
      - name: Always fails
        run: exit 1
